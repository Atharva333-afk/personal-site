    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { min-height: 100vh; min-height: 100dvh; background: #fff; }
    main, figure { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; }
    .page-image { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
    @media (prefers-reduced-motion: no-preference) { .page-image { animation: arrive .7s ease-out both; } @keyframes arrive { from { opacity: .8; } to { opacity: 1; } } }

    .hotspot-layer { position: absolute; z-index: 2; inset: 0 auto auto 0; width: 2048px; height: 805px; transform: scale(var(--image-scale, 1)); transform-origin: top left; pointer-events: none; }
    .hotspot { position: absolute; display: block; padding: 0; border: 1px solid transparent; border-radius: 0; background: transparent; cursor: pointer; pointer-events: auto; user-select: none; }
    .hotspot { appearance: none; -webkit-appearance: none; -webkit-tap-highlight-color: transparent; }
    .hotspot::after { content: ""; position: absolute; inset: 0; opacity: 0; pointer-events: none; background: var(--checker) repeat; background-size: 5px 5px; image-rendering: pixelated; }
    .hotspot.is-pressing:not([data-group="tool"]):not([data-group="menu"]), .hotspot.is-flashing { transform: translate(2px, 2px); border: 3px solid; border-color: var(--ButtonDkShadow) var(--ButtonHilight) var(--ButtonHilight) var(--ButtonDkShadow); box-shadow: inset 3px 3px 0 var(--ButtonShadow); }
    .hotspot.is-pressing:not([data-group="tool"]):not([data-group="menu"])::after, .hotspot.is-flashing::after { opacity: .58; }

    .hotspot[data-group="tool"]::before { content: ""; position: absolute; z-index: 1; left: 50%; top: 50%; width: 42px; height: 42px; opacity: 0; pointer-events: none; transform: translate(-50%, -50%); background-image: var(--jspaint-tools); background-repeat: no-repeat; background-size: 672px 42px; background-position: var(--icon-offset, 0px) 0; image-rendering: pixelated; }
    .hotspot[data-group="tool"].is-pressing, .hotspot[data-group="tool"].is-selected { transform: none; border: 3px solid; border-color: var(--ButtonDkShadow) var(--ButtonHilight) var(--ButtonHilight) var(--ButtonDkShadow); box-shadow: inset 3px 3px 0 var(--ButtonShadow), inset -3px -3px 0 var(--ButtonFace); background: var(--checker) repeat !important; background-size: 5px 5px !important; }
    .hotspot[data-group="tool"].is-pressing::before, .hotspot[data-group="tool"].is-selected::before { opacity: 1; }
    .hotspot[data-group="tool"].is-pressing::after, .hotspot[data-group="tool"].is-selected::after { opacity: 0; }
    .hotspot[data-group="tool"][aria-label="Text"]:not(.is-selected):not(.is-pressing) { border: 3px solid; border-color: var(--ButtonHilight) var(--ButtonDkShadow) var(--ButtonDkShadow) var(--ButtonHilight); box-shadow: inset -3px -3px 0 var(--ButtonShadow), inset 3px 3px 0 #dfdfdf; background: var(--ButtonFace) !important; }
    .hotspot[data-group="tool"][aria-label="Text"]:not(.is-selected):not(.is-pressing)::before { opacity: 1; }
    .hotspot[data-linkedin] { border: 3px solid; border-color: var(--ButtonHilight) var(--ButtonDkShadow) var(--ButtonDkShadow) var(--ButtonHilight); box-shadow: inset -3px -3px 0 var(--ButtonShadow), inset 3px 3px 0 #dfdfdf; background: var(--ButtonFace) !important; }
    .hotspot[data-linkedin]::before { width: 42px; height: 42px; opacity: 1; background-image: var(--linkedin-icon); background-size: 42px 42px; background-position: 0 0; }
    .hotspot[data-linkedin].is-pressing::before, .hotspot[data-linkedin].is-selected::before { transform: translate(calc(-50% + 2px), calc(-50% + 2px)); }
    .hotspot[data-linkedin].is-linkedin-click { animation: linkedin-button-click .34s steps(2, end); }
    .hotspot[data-linkedin].is-linkedin-click::before { animation: linkedin-icon-click .34s steps(2, end); }
    @keyframes linkedin-button-click {
      0%, 100% { outline: 0 solid transparent; }
      35% { outline: 4px dotted #0a66c2; outline-offset: 3px; }
      70% { outline: 2px dotted #fff; outline-offset: 1px; }
    }
    @keyframes linkedin-icon-click {
      0%, 100% { filter: none; }
      35% { filter: brightness(1.55) contrast(1.2); }
      70% { filter: brightness(.82) contrast(1.25); }
    }

    .typing-layer { position: absolute; z-index: 0; left: 238px; top: 130px; width: 1742px; height: 675px; overflow: hidden; pointer-events: none; background: #fff; color: #111; font: 44px/1.12 Arial, Helvetica, sans-serif; }
    .typed-line { position: absolute; left: 12px; min-height: 54px; white-space: pre; }
    .typed-line:nth-child(1) { top: 12px; }
    .typed-line:nth-child(2) { top: 122px; }
    .typed-line:nth-child(3) { top: 232px; }
    .typed-line:nth-child(4) { top: 342px; }
    .typed-line:nth-child(5) { top: 452px; }
    .typed-line:nth-child(6) { top: 562px; }
    .typed-line.is-typing::after { content: ""; display: inline-block; width: 3px; height: .92em; margin-left: 3px; vertical-align: -.1em; background: #111; animation: caret-blink .72s steps(1, end) infinite; }
    @keyframes caret-blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }

    .hotspot[data-group="menu"].is-highlighted { box-shadow: inset 3px 3px 0 var(--ButtonHilight), inset -3px -3px 0 var(--ButtonShadow); }
    .hotspot[data-group="menu"].is-pressing, .hotspot[data-group="menu"].is-menu-open { transform: none; border: 0; background: transparent; box-shadow: inset 3px 3px 0 var(--ButtonShadow), inset -3px -3px 0 var(--ButtonHilight); }
    .hotspot[data-group="menu"].is-pressing::after, .hotspot[data-group="menu"].is-menu-open::after { opacity: 0; }
    .hotspot:focus-visible { outline: 2px dotted #111; outline-offset: 1px; }

    .retro-menu { position: absolute; z-index: 20; width: 320px; padding: 5px; pointer-events: auto; background: var(--Menu); color: var(--MenuText); border: 3px solid; border-color: var(--ButtonHilight) var(--ButtonDkShadow) var(--ButtonDkShadow) var(--ButtonHilight); box-shadow: inset 2px 2px 0 var(--ButtonFace), inset -2px -2px 0 var(--ButtonShadow), 3px 3px 0 rgba(0,0,0,.25); font: 24px/1.1 Tahoma, "MS Sans Serif", sans-serif; }
    .retro-menu[hidden] { display: none; }
    .retro-menu-item { position: relative; display: flex; width: 100%; min-height: 40px; align-items: center; justify-content: space-between; gap: 18px; padding: 7px 14px 7px 36px; border: 0; background: transparent; color: inherit; text-align: left; font: inherit; cursor: pointer; appearance: none; -webkit-appearance: none; -webkit-tap-highlight-color: transparent; }
    .retro-menu-item:hover, .retro-menu-item:focus-visible { color: inherit; background: rgba(255,255,255,.2); box-shadow: inset 2px 2px 0 var(--ButtonHilight), inset -2px -2px 0 var(--ButtonShadow); outline: 0; }
    .retro-menu-item.is-pressing { transform: translate(2px, 2px); }
    .retro-menu-shortcut { margin-left: auto; white-space: nowrap; }
    .retro-menu-separator { height: 3px; margin: 5px 3px; border-top: 2px solid var(--ButtonShadow); border-bottom: 1px solid var(--ButtonHilight); }
    .helper { position: fixed; right: clamp(12px, 2vw, 28px); bottom: clamp(12px, 2vw, 28px); z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .helper-message { max-width: min(260px, 75vw); padding: 10px 12px; border: 3px solid #171717; background: #f5f0dc; color: #171717; box-shadow: 4px 4px 0 #171717; font: 700 14px/1.35 "Courier New", monospace; }
    .mascot-button { display: block; width: clamp(74px, 9vw, 126px); padding: 0; border: 3px solid #171717; background: #fff; box-shadow: 4px 4px 0 #171717; cursor: pointer; image-rendering: pixelated; }
    .mascot-button img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .mascot-button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #171717; }
    .mascot-button:focus-visible { outline: 3px dashed #171717; outline-offset: 5px; }
    @media (max-width: 520px) {
      .helper { right: 12px; bottom: 12px; gap: 6px; }
      .helper-message { max-width: min(200px, 62vw); padding: 8px 9px; font-size: 12px; }
      .mascot-button { width: clamp(64px, 18vw, 94px); }
    }
  </style>
</head>

  <script>
    const DESIGN_WIDTH = 2048;
    const DESIGN_HEIGHT = 805;
    const hotspotLayer = document.getElementById('hotspot-layer');
    const hotspots = [...document.querySelectorAll('.hotspot')];
    const toolButtons = [...document.querySelectorAll('.hotspot[data-group="tool"]')];
    const menuButtons = [...document.querySelectorAll('.hotspot[data-group="menu"]')];

    const sizeHotspots = () => {
      const scale = Math.max(window.innerWidth / DESIGN_WIDTH, window.innerHeight / DESIGN_HEIGHT);
      document.documentElement.style.setProperty('--image-scale', scale);
    };
    sizeHotspots();
    window.addEventListener('resize', sizeHotspots);

    const phrases = ['know', 'you know!', 'know you.', 'do you know!', 'you do know?', 'Who/What/When/How'];
    const typingPlans = [
      [{ type: 'knoe' }, { pause: 420 }, { delete: 1 }, { type: 'w' }],
      [{ type: 'yuo' }, { pause: 360 }, { delete: 3 }, { type: 'you know!' }],
      [{ type: 'know you,' }, { pause: 440 }, { delete: 1 }, { type: '.' }],
      [{ type: 'do ypu' }, { pause: 390 }, { delete: 3 }, { type: 'you know!' }],
      [{ type: 'you do know!' }, { pause: 470 }, { delete: 1 }, { type: '?' }],
      [{ type: 'Who/Whar' }, { pause: 520 }, { delete: 1 }, { type: 't/When/How' }]
    ];
    const typedLines = [...document.querySelectorAll('.typed-line')];
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reducedMotion) {
      typedLines.forEach((line, index) => { line.textContent = phrases[index]; });
    } else {
      const wait = (milliseconds) => new Promise((resolve) => window.setTimeout(resolve, milliseconds));
      const typeText = async (line, text) => {
        for (const character of text) {
          line.textContent += character;
          await wait(48 + Math.random() * 72);
        }
      };
      const deleteText = async (line, count) => {
        for (let index = 0; index < count; index += 1) {
          line.textContent = line.textContent.slice(0, -1);
          await wait(62 + Math.random() * 58);
        }
      };
      const runTyping = async () => {
        await wait(420);
        for (let lineIndex = 0; lineIndex < typingPlans.length; lineIndex += 1) {
          const line = typedLines[lineIndex];
          line.classList.add('is-typing');
          for (const action of typingPlans[lineIndex]) {
            if (action.type) await typeText(line, action.type);
            if (action.delete) await deleteText(line, action.delete);
            if (action.pause) await wait(action.pause);
          }
          line.textContent = phrases[lineIndex];
          line.classList.remove('is-typing');
          await wait(220 + Math.random() * 240);
        }
      };
      runTyping();
    }

    const menuContents = {
      File: [['New', 'Ctrl+N'], ['Open...', 'Ctrl+O'], ['Save', 'Ctrl+S'], ['Save As...', 'Ctrl+Shift+S'], '-', ['Print...', 'Ctrl+P'], ['Exit', '']],
      Edit: [['Undo', 'Ctrl+Z'], ['Repeat', 'F4'], '-', ['Cut', 'Ctrl+X'], ['Copy', 'Ctrl+C'], ['Paste', 'Ctrl+V'], ['Clear Selection', 'Del'], ['Select All', 'Ctrl+A']],
      View: [['Tool Box', 'Ctrl+T'], ['Color Box', 'Ctrl+L'], ['Status Bar', ''], ['Text Toolbar', ''], '-', ['Zoom', '']],
      Image: [['Flip/Rotate...', 'Ctrl+R'], ['Stretch/Skew...', 'Ctrl+W'], ['Invert Colors', 'Ctrl+I'], ['Attributes...', 'Ctrl+E'], ['Clear Image', 'Ctrl+Shift+N'], ['Draw Opaque', '']],
      Colors: [['Edit Colors...', ''], ['Get Colors...', ''], ['Save Colors...', '']],
      Help: [['Help Topics', 'F1'], ['About Paint', '']],
      Extras: [['Themes', ''], ['Language', ''], ['Multi-User', ''], ['Manage Storage', '']]
    };

    const menuPopup = document.createElement('div');
    menuPopup.className = 'retro-menu';
    menuPopup.setAttribute('role', 'menu');
    menuPopup.hidden = true;
    hotspotLayer.append(menuPopup);
    let activeMenuButton = null;

    const closeMenu = ({ restoreFocus = false } = {}) => {
      if (!activeMenuButton) return;
      const previousButton = activeMenuButton;
      previousButton.classList.remove('is-menu-open', 'is-highlighted');
      previousButton.setAttribute('aria-expanded', 'false');
      activeMenuButton = null;
      menuPopup.hidden = true;
      menuPopup.replaceChildren();
      if (restoreFocus) previousButton.focus();
    };

    const openMenu = (button, focusFirstItem = false) => {
      if (activeMenuButton === button) {
        closeMenu();
        return;
      }
      closeMenu();
      activeMenuButton = button;
      button.classList.add('is-menu-open');
      button.setAttribute('aria-expanded', 'true');
      const menuName = button.getAttribute('aria-label');
      menuPopup.setAttribute('aria-label', `${menuName} menu`);
      menuPopup.style.left = `${button.offsetLeft}px`;
      menuPopup.style.top = `${button.offsetTop + button.offsetHeight}px`;

      for (const entry of menuContents[menuName] || []) {
        if (entry === '-') {
          const separator = document.createElement('div');
          separator.className = 'retro-menu-separator';
          separator.setAttribute('role', 'separator');
          menuPopup.append(separator);
          continue;
        }
        const [label, shortcut] = entry;
        const item = document.createElement('button');
        item.className = 'retro-menu-item';
        item.type = 'button';
        item.setAttribute('role', 'menuitem');
        item.innerHTML = `<span>${label}</span>${shortcut ? `<span class="retro-menu-shortcut">${shortcut}</span>` : ''}`;
        item.addEventListener('pointerdown', () => item.classList.add('is-pressing'));
        item.addEventListener('pointerup', () => item.classList.remove('is-pressing'));
        item.addEventListener('pointercancel', () => item.classList.remove('is-pressing'));
        item.addEventListener('click', () => window.setTimeout(() => closeMenu(), 80));
        menuPopup.append(item);
      }

      menuPopup.hidden = false;
      if (focusFirstItem) menuPopup.querySelector('.retro-menu-item')?.focus();
    };

    menuPopup.addEventListener('keydown', (event) => {
      const items = [...menuPopup.querySelectorAll('.retro-menu-item')];
      const currentIndex = items.indexOf(document.activeElement);
      if (event.key === 'Escape') {
        event.preventDefault();
        closeMenu({ restoreFocus: true });
      } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        items[(currentIndex + 1) % items.length]?.focus();
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        items[(currentIndex - 1 + items.length) % items.length]?.focus();
      }
    });

    toolButtons.forEach((button, index) => {
      button.style.setProperty('--icon-offset', `${index * -42}px`);
      if (!button.hasAttribute('data-linkedin')) button.setAttribute('aria-pressed', 'false');
    });

    menuButtons.forEach((button) => {
      button.setAttribute('aria-haspopup', 'menu');
      button.setAttribute('aria-expanded', 'false');
      button.addEventListener('pointerenter', () => button.classList.add('is-highlighted'));
      button.addEventListener('pointerleave', () => {
        if (button !== activeMenuButton) button.classList.remove('is-highlighted');
      });
    });

    hotspots.forEach((button) => {
      const release = () => button.classList.remove('is-pressing');
      button.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        button.classList.add('is-pressing');
        button.setPointerCapture?.(event.pointerId);
      });
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', release);

      button.addEventListener('click', (event) => {
        if (button.hasAttribute('data-linkedin')) {
          button.classList.remove('is-linkedin-click');
          void button.offsetWidth;
          button.classList.add('is-linkedin-click');
          window.setTimeout(() => button.classList.remove('is-linkedin-click'), 360);
        } else if (button.dataset.group === 'tool') {
          toolButtons.forEach((tool) => {
            tool.classList.remove('is-selected');
            if (!tool.hasAttribute('data-linkedin')) tool.setAttribute('aria-pressed', 'false');
          });
          button.classList.add('is-selected');
          button.setAttribute('aria-pressed', 'true');
        } else if (button.dataset.group === 'menu') {
          openMenu(button, event.detail === 0);
        } else {
          button.classList.remove('is-flashing');
          void button.offsetWidth;
          button.classList.add('is-flashing');
          window.setTimeout(() => button.classList.remove('is-flashing'), 140);
        }
      });
    });

    document.addEventListener('pointerdown', (event) => {
      if (!event.target.closest('.retro-menu, .hotspot[data-group="menu"]')) closeMenu();
    });

    const mascotButton = document.getElementById('mascot-button');
    const helperMessage = document.getElementById('helper-message');
    mascotButton.addEventListener('click', () => {
      helperMessage.textContent = 'click the help button on the top next to color';
    });
  </script>
</body>
</html>
